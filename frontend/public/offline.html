<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F7F9" />
    <title>Offline | Sarvaikam</title>
    <style>
      :root { color-scheme: light; --canvas: #F6F7F9; --ink: #1F2933; --muted: #5B6573; --accent: #B4410D; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) { color-scheme: dark; --canvas: #14181F; --ink: #E8ECF1; --muted: #9AA4B2; --accent: #F08A5D; }
      }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--canvas); color: var(--ink); font-family: system-ui, sans-serif; }
      main { max-width: 360px; text-align: center; }
      img { width: 56px; height: 56px; }
      h1 { font-size: 1.5rem; margin: 16px 0 8px; }
      p { color: var(--muted); line-height: 1.6; margin: 0 0 24px; }
      button { font: inherit; font-weight: 600; padding: 12px 24px; border: 0; border-radius: 999px; background: var(--accent); color: #fff; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo-mark.png" alt="" />
      <h1>You're offline</h1>
      <p>Lessons you have already opened may still be available. Reconnect to load new content and save your progress.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
