server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API gateway: route each prefix to the owning service.
    # Docker's embedded DNS (127.0.0.11) resolves service names lazily, so nginx starts even if a backend is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $content  http://content-service:8081;
    set $auth     http://auth-service:8082;
    set $progress http://progress-service:8083;

    location /api/content/  { proxy_pass $content;  proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; }
    location /api/auth/     { proxy_pass $auth;     proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; }
    location /api/progress/ { proxy_pass $progress; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
