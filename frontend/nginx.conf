server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same security headers as the all-in-one image (docker/nginx.conf.template). HSTS is added by the ingress
    # once TLS terminates there; it is pointless on plain-http local compose.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Admin uploads PUT directly to a signed GCS URL or a Google Drive resumable session (XHR), so connect-src allows both.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://storage.googleapis.com https://www.googleapis.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Actuator is for probes only, never for the public internet (the k8s Ingress also routes this prefix here).
    location /api/content/actuator/ { return 404; }

    # API gateway: route each prefix to the owning service.
    # Docker's embedded DNS (127.0.0.11) resolves service names lazily, so nginx starts even if a backend is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $content  http://content-service:8081;
    set $auth     http://auth-service:8082;
    # Strangler routing: PROGRESS_UPSTREAM (substituted when the container starts) is the Core or the Go service.
    set $progress ${PROGRESS_UPSTREAM};

    location /api/content/  { proxy_pass $content;  proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; }
    location /api/auth/     { proxy_pass $auth;     proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; }
    set $core     http://core:8084;
    location /api/session/  { proxy_pass $core;     proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-Host $host; }
    location /api/progress/ { proxy_pass $progress; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
