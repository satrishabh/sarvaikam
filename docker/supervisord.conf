[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:postgres]
command=su-exec postgres postgres -D /var/lib/postgresql/data -c listen_addresses=127.0.0.1
autostart=%(ENV_EMBEDDED_DB)s
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Services retry their DB connection / get restarted by supervisord until Postgres is reachable.
[program:content-service]
command=java -XX:MaxRAMPercentage=40 -jar /app/content/app.jar
autorestart=true
startretries=20
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:auth-service]
command=node /app/auth/dist/main.js
directory=/app/auth
autorestart=true
startretries=20
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:progress-service]
command=/app/progress/progress-service
autorestart=true
startretries=20
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
