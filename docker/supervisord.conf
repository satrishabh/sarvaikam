; Runs as the image's non-root user; all runtime files live in /tmp/runtime.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/runtime/supervisord.pid
childlogdir=/tmp/runtime

[program:postgres]
command=postgres -D %(ENV_PGDATA)s -c listen_addresses=127.0.0.1 -c unix_socket_directories=/tmp/runtime
autostart=%(ENV_EMBEDDED_DB)s
autorestart=true
priority=1
stopsignal=INT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Services retry their DB connection / get restarted by supervisord until Postgres is reachable.
[program:content-service]
command=/bin/sh -c 'exec java $JAVA_OPTS -jar /app/content/app.jar'
autorestart=true
startretries=20
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:auth-service]
command=node /app/auth/dist/main.js
directory=/app/auth
autorestart=true
startretries=20
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:progress-service]
command=/app/progress/progress-service
autorestart=true
startretries=20
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=nginx -e stderr -c /tmp/runtime/nginx.conf -g "daemon off;"
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
