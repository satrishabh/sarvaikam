services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sarvaikam}
      POSTGRES_USER: ${POSTGRES_USER:-sarvaikam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sarvaikam}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sarvaikam}"]
      interval: 5s
      retries: 10

  reels-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sarvaikam_reels
      POSTGRES_USER: ${REELS_DB_USER:-sarvaikam}
      POSTGRES_PASSWORD: ${REELS_DB_PASSWORD:-sarvaikam}
    ports: ["5433:5432"]
    volumes: [reelsdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${REELS_DB_USER:-sarvaikam} -d sarvaikam_reels"]
      interval: 5s
      retries: 10

  content-service:
    build: ./services/content-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sarvaikam}
      DB_USER: ${POSTGRES_USER:-sarvaikam}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sarvaikam}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-of-32-bytes-min}
      AUTH_SERVICE_URL: http://auth-service:8082
      GCP_CONTENT_BUCKET: ${GCP_CONTENT_BUCKET:-}
      GCP_SIGNING_SERVICE_ACCOUNT: ${GCP_SIGNING_SERVICE_ACCOUNT:-}
      REELS_DB_URL: jdbc:postgresql://reels-postgres:5432/sarvaikam_reels
      REELS_DB_USER: ${REELS_DB_USER:-sarvaikam}
      REELS_DB_PASSWORD: ${REELS_DB_PASSWORD:-sarvaikam}
    depends_on: { postgres: { condition: service_healthy }, reels-postgres: { condition: service_healthy } }

  auth-service:
    build: ./services/auth-service
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-sarvaikam}
      DB_USER: ${POSTGRES_USER:-sarvaikam}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sarvaikam}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-of-32-bytes-min}
      APP_ENV: ${APP_ENV:-dev}
      PROFILE_ISSUER: ${PROFILE_ISSUER:-https://profile.sarvaikam.com/realms/sarvaikam}
      PROFILE_API_CLIENT_ID: ${PROFILE_API_CLIENT_ID:-sarvaikam-learn-api}
      PROFILE_API_CLIENT_SECRET: ${PROFILE_API_CLIENT_SECRET:-}
      PROFILE_REGISTRATION_CLIENT_ID: ${PROFILE_REGISTRATION_CLIENT_ID:-sarvaikam-learn-registration}
      PROFILE_REGISTRATION_CLIENT_SECRET: ${PROFILE_REGISTRATION_CLIENT_SECRET:-}
    depends_on: { postgres: { condition: service_healthy } }

  progress-service:
    build: ./services/progress-service
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sarvaikam}:${POSTGRES_PASSWORD:-sarvaikam}@postgres:5432/${POSTGRES_DB:-sarvaikam}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-of-32-bytes-min}
      AUTH_SERVICE_URL: http://auth-service:8082
      CONTENT_SERVICE_URL: http://content-service:8081
    depends_on: { postgres: { condition: service_healthy } }

  frontend:
    build: ./frontend
    ports: ["80:80"]
    depends_on: [content-service, auth-service, progress-service]

volumes:
  pgdata:
  reelsdata:
