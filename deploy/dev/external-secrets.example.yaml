# Syncs runtime secrets from Google Secret Manager into the dev namespace with External Secrets Operator,
# so secret values never live in aio-gitops or in hand-made kubectl secrets. Requires ESO v0.17+ installed.
#
# 1. Create the secrets once (values are read from your terminal, not typed into the command line):
#      gcloud secrets create sarvaikam-dev-db-password --replication-policy=automatic --data-file=-
#      gcloud secrets create sarvaikam-dev-jwt-secret  --replication-policy=automatic --data-file=-
#      gcloud secrets add-iam-policy-binding sarvaikam-dev-db-password \
#        --member=serviceAccount:sarvaikam-content@project-d28840cd-be2f-4901-85e.iam.gserviceaccount.com \
#        --role=roles/secretmanager.secretAccessor          # repeat for sarvaikam-dev-jwt-secret
#    (The Terraform in infra/terraform/gcp creates and grants these for Terraform-managed environments.)
# 2. Fill in <gke-cluster-name>, apply, and check: kubectl get externalsecret -n dev  (STATUS SecretSynced)
# 3. In aio-gitops values-dev.yaml add envFrom: [{secretRef: {name: sarvaikam-runtime}}] and remove the
#    old POSTGRES_PASSWORD / JWT_SECRET sources. Rotating = add a new Secret Manager version; ESO refreshes
#    within refreshInterval, then restart the pod.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-secret-manager
  namespace: dev
spec:
  provider:
    gcpsm:
      projectID: project-d28840cd-be2f-4901-85e
      auth:
        workloadIdentity:
          clusterLocation: asia-south1
          clusterName: <gke-cluster-name>
          serviceAccountRef:
            name: sarvaikam-content
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sarvaikam-runtime
  namespace: dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-secret-manager
  target:
    name: sarvaikam-runtime
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef: {key: sarvaikam-dev-db-password}
    - secretKey: JWT_SECRET
      remoteRef: {key: sarvaikam-dev-jwt-secret}
