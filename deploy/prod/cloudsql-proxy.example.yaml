# Cloud SQL Auth Proxy for prod. Replace <connection-name> with: terraform output db_connection_name
# Runs as the workload-identity bound KSA sarvaikam-content (roles/cloudsql.client).
# The proxy encrypts traffic to Cloud SQL, so the app connects to it with DB_SSLMODE=disable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sarvaikam-cloudsql-proxy
  namespace: prod
  labels:
    app.kubernetes.io/name: sarvaikam-cloudsql-proxy
spec:
  replicas: 2   # two proxies so a node drain does not cut the database off
  selector:
    matchLabels:
      app.kubernetes.io/name: sarvaikam-cloudsql-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sarvaikam-cloudsql-proxy
    spec:
      serviceAccountName: sarvaikam-content
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.26.3
          args:
            - --structured-logs
            - --address=0.0.0.0
            - --port=5432
            - --private-ip
            - <connection-name>
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            tcpSocket: {port: postgres}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: postgres}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: sarvaikam-cloudsql-proxy
  namespace: prod
spec:
  selector:
    app.kubernetes.io/name: sarvaikam-cloudsql-proxy
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# Only the Sarvaikam app pods may open database connections through the proxy; without this any pod in the
# cluster could reach Cloud SQL here. Check the label first: kubectl get pods -n prod -l app.kubernetes.io/name=sarvaikam
# (GKE Autopilot / Dataplane V2 enforces NetworkPolicy.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sarvaikam-cloudsql-proxy
  namespace: prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sarvaikam-cloudsql-proxy
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sarvaikam
      ports:
        - protocol: TCP
          port: 5432
