apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-service
spec:
  replicas: 2
  selector: { matchLabels: { app: content-service } }
  template:
    metadata: { labels: { app: content-service } }
    spec:
      containers:
        - name: content-service
          image: sarvaikam/content-service
          ports: [{ containerPort: 8081 }]
          env:
            - { name: DB_URL, valueFrom: { secretKeyRef: { name: sarvaikam-secrets, key: CONTENT_DB_URL } } }
            - { name: DB_USER, valueFrom: { secretKeyRef: { name: sarvaikam-secrets, key: POSTGRES_USER } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: sarvaikam-secrets, key: POSTGRES_PASSWORD } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: sarvaikam-secrets, key: JWT_SECRET } } }
          startupProbe:
            httpGet: { path: /api/content/actuator/health, port: 8081 }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /api/content/actuator/health, port: 8081 }
          livenessProbe:
            httpGet: { path: /api/content/actuator/health, port: 8081 }
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: content-service
spec:
  selector: { app: content-service }
  ports: [{ port: 8081, targetPort: 8081 }]
