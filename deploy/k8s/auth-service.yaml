apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 2
  selector: { matchLabels: { app: auth-service } }
  template:
    metadata: { labels: { app: auth-service } }
    spec:
      containers:
        - name: auth-service
          image: sarvaikam/auth-service
          ports: [{ containerPort: 8082 }]
          env:
            - { name: DB_HOST, valueFrom: { secretKeyRef: { name: sarvaikam-secrets, key: DB_HOST } } }
            - { name: DB_PORT, value: "5432" }
            - { name: DB_NAME, valueFrom: { secretKeyRef: { name: sarvaikam-secrets, key: POSTGRES_DB } } }
            - { name: DB_USER, valueFrom: { secretKeyRef: { name: sarvaikam-secrets, key: POSTGRES_USER } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: sarvaikam-secrets, key: POSTGRES_PASSWORD } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: sarvaikam-secrets, key: JWT_SECRET } } }
            - { name: ADMIN_EMAIL, valueFrom: { secretKeyRef: { name: sarvaikam-secrets, key: ADMIN_EMAIL } } }
            - { name: ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: sarvaikam-secrets, key: ADMIN_PASSWORD } } }
          readinessProbe:
            httpGet: { path: /api/auth/health, port: 8082 }
          livenessProbe:
            httpGet: { path: /api/auth/health, port: 8082 }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector: { app: auth-service }
  ports: [{ port: 8082, targetPort: 8082 }]
