apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sarvaikam
resources:
  - namespace.yaml
  - secret.yaml
  - postgres.yaml
  - content-service.yaml
  - auth-service.yaml
  - progress-service.yaml
  - frontend.yaml
  - ingress.yaml
# Point these at your registry (ECR / ACR / Artifact Registry) - see infra/terraform outputs.
images:
  - name: sarvaikam/content-service
    newTag: latest
  - name: sarvaikam/auth-service
    newTag: latest
  - name: sarvaikam/progress-service
    newTag: latest
  - name: sarvaikam/frontend
    newTag: latest
