apiVersion: apps/v1
kind: Deployment
metadata:
  name: progress-service
spec:
  replicas: 2
  selector: { matchLabels: { app: progress-service } }
  template:
    metadata: { labels: { app: progress-service } }
    spec:
      containers:
        - name: progress-service
          image: sarvaikam/progress-service
          ports: [{ containerPort: 8083 }]
          env:
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: sarvaikam-secrets, key: PROGRESS_DATABASE_URL } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: sarvaikam-secrets, key: JWT_SECRET } } }
          readinessProbe:
            httpGet: { path: /api/progress/health, port: 8083 }
          livenessProbe:
            httpGet: { path: /api/progress/health, port: 8083 }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: progress-service
spec:
  selector: { app: progress-service }
  ports: [{ port: 8083, targetPort: 8083 }]
