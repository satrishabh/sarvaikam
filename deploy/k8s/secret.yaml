# Demo values only. In production create this from a secret manager (External Secrets / Sealed Secrets)
# and point DB_HOST at the managed database (RDS / Azure PostgreSQL / Cloud SQL) instead of the in-cluster one.
apiVersion: v1
kind: Secret
metadata:
  name: sarvaikam-secrets
type: Opaque
stringData:
  POSTGRES_DB: sarvaikam
  POSTGRES_USER: sarvaikam
  POSTGRES_PASSWORD: change-me
  DB_HOST: postgres
  JWT_SECRET: change-me-to-a-long-random-secret-of-32-bytes-min
  ADMIN_EMAIL: admin@sarvaikam.dev
  ADMIN_PASSWORD: change-me-admin
  CONTENT_DB_URL: jdbc:postgresql://postgres:5432/sarvaikam
  PROGRESS_DATABASE_URL: postgres://sarvaikam:change-me@postgres:5432/sarvaikam?sslmode=disable
