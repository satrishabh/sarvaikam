server:
  port: 8081
  servlet:
    context-path: /api/content

spring:
  application:
    name: content-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sarvaikam}
    username: ${DB_USER:sarvaikam}
    password: ${DB_PASSWORD:sarvaikam}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    table: content_flyway_history
    baseline-on-migrate: true

app:
  jwt-secret: ${JWT_SECRET:change-me-to-a-long-random-secret-of-32-bytes-min}
  seed-pattern: ${SEED_PATTERN:classpath*:seed/*.json}

management:
  endpoints:
    web:
      exposure:
        include: health
