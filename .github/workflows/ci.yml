name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:learning
      - run: npm run build

  auth-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/auth-service/package-lock.json
      - run: npm ci
      - run: npm test

  progress-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/progress-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/progress-service/go.mod
      - run: go test ./...

  content-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/content-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B test

  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Tests use Testcontainers (Postgres); the GitHub-hosted runner provides Docker.
      - run: mvn -B test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Scans the full git history for committed credentials. Pin this image by digest once the first run is green.
      - run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4
          detect --source /repo --redact --no-banner --exit-code 1

  image:
    # Builds the all-in-one image exactly as Kaniko does, so a broken Dockerfile fails here instead of at deploy.
    runs-on: ubuntu-latest
    needs: [frontend, auth-service, progress-service, content-service, core]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sarvaikam:ci .
      # Fails on fixable CRITICAL vulnerabilities; HIGH ones are listed but don't block (tighten once clean).
      # Pin this image by digest once the first run is green.
      - name: Scan image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 \
            image --no-progress --ignore-unfixed --severity HIGH --exit-code 0 sarvaikam:ci
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 \
            image --no-progress --ignore-unfixed --severity CRITICAL --exit-code 1 sarvaikam:ci
