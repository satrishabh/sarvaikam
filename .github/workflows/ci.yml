name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:learning
      - run: npm run build

  auth-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/auth-service/package-lock.json
      - run: npm ci
      - run: npm test

  progress-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/progress-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/progress-service/go.mod
      - run: go test ./...

  content-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/content-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B test

  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Tests use Testcontainers (Postgres); the GitHub-hosted runner provides Docker.
      - run: mvn -B test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Scans the full git history for committed credentials. Pin this image by digest once the first run is green.
      - run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4
          detect --source /repo --redact --no-banner --exit-code 1

  image:
    # Builds the all-in-one image exactly as Kaniko does, so a broken Dockerfile fails here instead of at deploy.
    runs-on: ubuntu-latest
    needs: [frontend, auth-service, progress-service, content-service, core]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sarvaikam:ci .
      # Boots the image (no database needed for these checks): the entrypoint validates the nginx config, known
      # app routes return 200, unknown paths a real 404 with the app shell, and access logs are Cloud Logging JSON.
      - name: Smoke-test the image
        run: |
          docker run -d --name smoke -p 8080:8080 -e APP_ENV=staging -e EMBEDDED_DB=false -e DB_HOST=db.invalid \
            -e POSTGRES_PASSWORD=ci-only-not-a-secret -e JWT_SECRET="$(openssl rand -hex 32)" -e LOG_FORMAT=json sarvaikam:ci
          for i in $(seq 1 30); do curl -fs -o /dev/null http://localhost:8080/health && break; sleep 2; done
          code() { curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$1"; }
          test "$(code /)" = 200
          test "$(code /paths)" = 200
          test "$(code /topics/python/basics)" = 200
          test "$(code /no-such-page)" = 404
          curl -s http://localhost:8080/no-such-page | grep -q 'id="root"'
          test "$(code /api/content/actuator/health)" = 404
          docker logs smoke 2>&1 | grep -q '"httpRequest"'
      - name: Image logs on failure
        if: failure()
        run: docker logs smoke 2>&1 | tail -100 || true
      # Fails on fixable CRITICAL vulnerabilities; HIGH ones are listed but don't block (tighten once clean).
      # Pin this image by digest once the first run is green.
      - name: Scan image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 \
            image --no-progress --ignore-unfixed --severity HIGH --exit-code 0 sarvaikam:ci
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 \
            image --no-progress --ignore-unfixed --severity CRITICAL --exit-code 1 sarvaikam:ci
